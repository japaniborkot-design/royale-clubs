<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Card Lounge HD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: radial-gradient(circle, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar / Header */
        .header {
            background: rgba(0, 0, 0, 0.85);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ffd700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #ffd700;
            background: #fff url('https://api.dicebear.com/7.x/bottts/svg?seed=Murad') center/cover;
        }

        .wallet-box {
            background: linear-gradient(45deg, #111, #333);
            border: 1.5px solid #ffd700;
            padding: 6px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: #ffd700;
            box-shadow: inset 0 0 5px #ffd700;
        }

        /* Lobby Grid */
        .lobby-container {
            flex: 1;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .game-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(0,0,0,0.6));
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .game-card:active {
            transform: scale(0.95);
        }

        .game-card h3 {
            color: #ffd700;
            margin-top: 10px;
            font-size: 1.1rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .game-icon {
            font-size: 3rem;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
        }

        .btn {
            background: linear-gradient(180deg, #ffd700, #ffa500);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Table Screen (Game Area) */
        .game-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            background: radial-gradient(circle, #076585, #fff);
            background: #0b6623; /* Classic Felt Green */
            border: 10px solid #5c4033;
            border-radius: 30px;
            margin: 10px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
            position: relative;
        }

        .cards-container {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .card {
            width: 60px;
            height: 90px;
            background: #fff;
            border-radius: 8px;
            color: #000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            animation: deal 0.4s ease-out;
        }

        .card.red { color: #d00; }

        @keyframes deal {
            from { transform: translateY(-100px) scale(0); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* Modal Screen */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #222;
            border: 2px solid #ffd700;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .input-field {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="user-info">
            <div class="avatar"></div>
            <div>
                <div style="font-weight: bold; color: #fff;">Player_789</div>
                <div style="font-size: 0.8rem; color: #aaa;">Status: Online</div>
            </div>
        </div>
        <div class="wallet-box" onclick="openWithdrawModal()">
            <span>🪙 Coins:</span>
            <span id="coin-balance">500</span>
        </div>
    </div>

    <!-- Main Lobby -->
    <div class="lobby-container" id="lobby">
        <div class="game-card" onclick="startGame('Teen Patti')">
            <div class="game-icon">🎴</div>
            <h3>Teen Patti</h3>
            <button class="btn">PLAY NOW</button>
        </div>
        <div class="game-card" onclick="startGame('Andar Bahar')">
            <div class="game-icon">⚖️</div>
            <h3>Andar Bahar</h3>
            <button class="btn">PLAY NOW</button>
        </div>
        <div class="game-card" onclick="startGame('Rummy')">
            <div class="game-icon">🃏</div>
            <h3>Rummy 13</h3>
            <button class="btn">PLAY NOW</button>
        </div>
        <div class="game-card" onclick="openWithdrawModal()">
            <div class="game-icon">🏦</div>
            <h3>Withdraw</h3>
            <button class="btn" style="background: #28a745; color: #fff;">CASH OUT</button>
        </div>
    </div>

    <!-- Active Game Screen -->
    <div class="game-screen" id="game-screen">
        <h2 id="game-title" style="color: #ffd700;">Game Table</h2>
        
        <div style="text-align: center;">
            <p style="color: #ccc; margin-bottom: 5px;">Dealer Hand</p>
            <div class="cards-container" id="dealer-cards">
                <div class="card"><span>?</span></div>
                <div class="card"><span>?</span></div>
            </div>
        </div>

        <div style="text-align: center;">
            <p style="color: #ccc; margin-bottom: 5px;">Your Hand</p>
            <div class="cards-container" id="player-cards"></div>
        </div>

        <div>
            <button class="btn" onclick="playHand()">DEAL (10 Coins)</button>
            <button class="btn" style="background: #dc3545; color: #fff;" onclick="backToLobby()">EXIT</button>
        </div>
    </div>

    <!-- Withdraw Modal -->
    <div class="modal" id="withdraw-modal">
        <div class="modal-content">
            <h3 style="color: #ffd700; margin-bottom: 15px;">উত্তোলন রিকোয়েস্ট (Withdrawal)</h3>
            <input type="number" id="withdraw-amount" class="input-field" placeholder="কয়েন পরিমাণ (যেমন: 100)">
            <input type="text" id="bkash-number" class="input-field" placeholder="বিকাশ / নগদ নম্বর">
            <button class="btn" onclick="submitWithdraw()">রিকোয়েস্ট পাঠান</button>
            <button class="btn" style="background: #555; color:#fff;" onclick="closeWithdrawModal()">বন্ধ করুন</button>
        </div>
    </div>

    <script>
        let coins = 500;
        const suits = ['♠', '♥', '♦', '♣'];
        const values = ['A', 'K', 'Q', 'J', '10', '9', '8'];

        function updateBalance() {
            document.getElementById('coin-balance').innerText = coins;
        }

        function startGame(name) {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('game-title').innerText = name + " Table";
            document.getElementById('player-cards').innerHTML = '';
        }

        function backToLobby() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('lobby').style.display = 'grid';
        }

        function getRandomCard() {
            const suit = suits[Math.floor(Math.random() * suits.length)];
            const val = values[Math.floor(Math.random() * values.length)];
            const isRed = suit === '♥' || suit === '♦';
            return { val, suit, isRed };
        }

        function playHand() {
            if (coins < 10) {
                alert("আপনার পর্যাপ্ত কয়েন নেই!");
                return;
            }
            coins -= 10;
            updateBalance();

            const playerCardsDiv = document.getElementById('player-cards');
            playerCardsDiv.innerHTML = '';
            
            // Deal 3 Cards
            for (let i = 0; i < 3; i++) {
                const card = getRandomCard();
                const cardEl = document.createElement('div');
                cardEl.className = `card ${card.isRed ? 'red' : ''}`;
                cardEl.innerHTML = `<div>${card.val}</div><div>${card.suit}</div>`;
                playerCardsDiv.appendChild(cardEl);
            }

            // Simple Win/Loss Logic Demonstration
            setTimeout(() => {
                if (Math.random() > 0.5) {
                    const winAmount = 30;
                    coins += winAmount;
                    alert(`অভিনন্দন! আপনি বিজয়ী হয়েছেন এবং ${winAmount} কয়েন পেয়েছেন!`);
                } else {
                    alert("হেরে গেছেন! আবার চেষ্টা করুন।");
                }
                updateBalance();
            }, 600);
        }

        function openWithdrawModal() {
            document.getElementById('withdraw-modal').style.display = 'flex';
        }

        function closeWithdrawModal() {
            document.getElementById('withdraw-modal').style.display = 'none';
        }

        function submitWithdraw() {
            const amount = parseInt(document.getElementById('withdraw-amount').value);
            const number = document.getElementById('bkash-number').value;

            if (!amount || !number) {
                alert("সবগুলো তথ্য সঠিকভাবে পূরণ করুন!");
                return;
            }

            if (amount > coins) {
                alert("আপনার একাউন্টে পর্যাপ্ত কয়েন নেই!");
                return;
            }

            coins -= amount;
            updateBalance();
            alert(`আপনার ${amount} কয়েনের উইথড্র রিকোয়েস্ট (নম্বর: ${number}) এডমিন প্যানেলে পাঠানো হয়েছে!`);
            closeWithdrawModal();
        }
    </script>
</body>
</html>
