<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Lottery BD</title>
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #121212; color: #fff; text-align: center; padding: 15px; }
    
    .header { background: #1f1f1f; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    .wallet-container { display: flex; justify-content: space-around; margin-top: 10px; }
    .wallet-box { background: #2a2a2a; padding: 10px 15px; border-radius: 8px; border: 1px solid #ffb703; width: 45%; }
    .demo-box { border-color: #00b4d8; }
    .btn-deposit { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 12px; font-weight: bold; width: 90%; }
    
    .card { background: #1f1f1f; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    h2 { font-size: 18px; margin-bottom: 10px; color: #ffb703; }
    .game-btn { background: #e63946; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 5px; cursor: pointer; margin: 5px; width: 90%; font-weight: bold; }
    .demo-btn { background: #00b4d8; }

    /* Modal / Popups */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: #222; padding: 20px; border-radius: 10px; width: 85%; max-width: 400px; text-align: left; border: 1px solid #ffb703; }
    .modal-content input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #444; background: #111; color: white; }
    .close-btn { background: #777; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; float: right; }
    .submit-btn { background: #28a745; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }

    /* Chat Section */
    .chat-box { background: #2a2a2a; height: 140px; border-radius: 5px; padding: 10px; overflow-y: auto; text-align: left; font-size: 13px; margin-bottom: 8px; }
    .chat-input { width: 70%; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #111; color: white; }
    .send-btn { width: 25%; padding: 8px; background: #ffb703; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Header Section -->
  <div class="header">
    <h1>Ludo Lottery BD</h1>
    <div class="wallet-container">
      <div class="wallet-box demo-box">
        <small>Demo Coins</small>
        <h3 id="demo-balance">🪙 1,000</h3>
      </div>
      <div class="wallet-box">
        <small>Real Balance</small>
        <h3 id="real-balance">৳ <span id="real-val">0.00</span></h3>
      </div>
    </div>
    <button class="btn-deposit" onclick="openModal('deposit-modal')">+ Deposit / Withdraw</button>
  </div>

  <!-- Ludo Games Section -->
  <div class="card">
    <h2>🎮 লুডু গেম সেকশন</h2>
    <button class="game-btn demo-btn" onclick="playDemoLudo()">Play Demo Ludo (Free)</button>
    <button class="game-btn" onclick="playRealLudo()">Play Real Ludo (৳50)</button>
  </div>

  <!-- Weekly Lottery Section -->
  <div class="card">
    <h2>🏆 সাপ্তাহিক লটারি ড্র</h2>
    <p>বর্তমান প্রাইজ পুল: <strong>৳২৫,০০০</strong></p>
    <button class="game-btn" style="background: #ffb703; color: #000;" onclick="buyLotteryTicket()">Buy Ticket (৳৫০)</button>
  </div>

  <!-- Public Chat Section -->
  <div class="card">
    <h2>💬 পাবলিক আড্ডা রুম</h2>
    <div class="chat-box" id="chat-messages"></div>
    <div style="display:flex; justify-content:space-between;">
      <input type="text" id="chat-input" class="chat-input" placeholder="মেসেজ লিখুন...">
      <button class="send-btn" onclick="sendChatMessage()">Send</button>
    </div>
  </div>

  <!-- Deposit Modal Popup -->
  <div class="modal" id="deposit-modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal('deposit-modal')">X</button>
      <h3 style="color:#ffb703; margin-bottom:10px;">ডিপোজিট করুন</h3>
      <p style="font-size:13px; color:#fff; background:#333; padding:8px; border-radius:5px; margin-bottom:8px;">
        নগদ পার্সোনাল নম্বর: <strong style="color:#ffb703;">01787322043</strong> (Send Money)
      </p>
      <input type="number" id="dep-amount" placeholder="টাকার পরিমাণ (যেমন: 50)">
      <input type="text" id="dep-trx" placeholder="Transaction ID (TrxID)">
      <input type="text" id="dep-phone" placeholder="আপনার নগদ নম্বর">
      <button class="submit-btn" onclick="submitDeposit()">রিকোয়েস্ট পাঠান</button>
    </div>
  </div>

  <!-- Firebase Script Logic -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAz3s7sdeeaKlrmUmzRGO4DpdN4siiOp9k",
      authDomain: "ludo-lottery-bd.firebaseapp.com",
      projectId: "ludo-lottery-bd",
      storageBucket: "ludo-lottery-bd.firebasestorage.app",
      messagingSenderId: "616910126041",
      appId: "1:616910126041:web:ef3fabaf22ba74020df7c8",
      databaseURL: "https://ludo-lottery-bd-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Generate or get unique device User ID
    let userId = localStorage.getItem("ludo_user_id");
    if(!userId) {
      userId = "user_" + Math.floor(100000 + Math.random() * 900000);
      localStorage.setItem("ludo_user_id", userId);
    }

    // 1. Firebase Live Balance Sync
    const userRef = db.ref('users/' + userId);
    userRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if(data) {
        document.getElementById('demo-balance').innerText = '🪙 ' + (data.demo_coins || 1000);
        document.getElementById('real-val').innerText = (data.real_balance || 0).toFixed(2);
      } else {
        userRef.set({ demo_coins: 1000, real_balance: 0 });
      }
    });

    // 2. Deposit Request to Firebase
    function submitDeposit() {
      const amount = parseFloat(document.getElementById('dep-amount').value);
      const trx = document.getElementById('dep-trx').value.trim();
      const phone = document.getElementById('dep-phone').value.trim();

      if(!amount || !trx || !phone) {
        alert("সবগুলো ঘর সঠিকভাবে পূরণ করুন!");
        return;
      }

      db.ref('deposit_requests').push({
        userId: userId,
        amount: amount,
        trxId: trx,
        phone: phone,
        status: 'pending',
        timestamp: Date.now()
      }).then(() => {
        alert("আপনার ডিপোজিট রিকোয়েস্টটি পাঠানো হয়েছে! এডমিন ক্যাশ ইন ভেরিফাই করে ব্যালেন্স যোগ করে দেবে।");
        closeModal('deposit-modal');
        document.getElementById('dep-amount').value = '';
        document.getElementById('dep-trx').value = '';
        document.getElementById('dep-phone').value = '';
      });
    }

    // 3. Buy Lottery Ticket with Real Balance Check
    function buyLotteryTicket() {
      userRef.once('value', (snapshot) => {
        const val = snapshot.val() || {};
        const currentBal = val.real_balance || 0;
        if(currentBal < 50) {
          alert("লটারির টিকিট কিনতে আপনার ওয়ালেটে অন্তত ৳৫০ রিয়েল ব্যালেন্স থাকতে হবে। ডিপোজিট করুন!");
          openModal('deposit-modal');
        } else {
          userRef.update({ real_balance: currentBal - 50 });
          db.ref('lottery_tickets').push({ userId: userId, time: Date.now() });
          alert("অভিনন্দন! আপনি ৫০ টাকায় ১টি লটারি টিকিট কিনেছেন।");
        }
      });
    }

    // 4. Play Ludo Actions
    function playDemoLudo() { alert("ডেমো লুডু টেবিলে কানেক্ট হচ্ছে..."); }
    function playRealLudo() {
      userRef.once('value', (snapshot) => {
        const currentBal = (snapshot.val() || {}).real_balance || 0;
        if(currentBal < 50) {
          alert("রিয়েল লুডু খেলতে ৳৫০ ব্যালেন্স প্রয়োজন।");
          openModal('deposit-modal');
        } else {
          alert("রিয়েল লুডু টেবিলে রিডাইরেক্ট করা হচ্ছে...");
        }
      });
    }

    // 5. Firebase Real-time Chat Logic
    function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const msg = input.value.trim();
      if(msg !== "") {
        db.ref('chat_messages').push({
          sender: userId.substring(0, 8),
          text: msg,
          time: Date.now()
        });
        input.value = '';
      }
    }

    db.ref('chat_messages').limitToLast(15).on('child_added', (snapshot) => {
      const chat = snapshot.val();
      const chatBox = document.getElementById('chat-messages');
      const msgElem = document.createElement('div');
      msgElem.style.marginBottom = "5px";
      msgElem.innerHTML = `<strong style="color:#ffb703;">${chat.sender}:</strong> ${chat.text}`;
      chatBox.appendChild(msgElem);
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    // Modal UI Functions
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  </script>
</body>
</html>
