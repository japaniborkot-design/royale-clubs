<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Lottery BD</title>
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #121212; color: #fff; text-align: center; padding: 15px; }
    
    /* Header & Wallet */
    .header { background: #1f1f1f; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    .wallet-container { display: flex; justify-content: space-around; margin-top: 10px; }
    .wallet-box { background: #2a2a2a; padding: 10px 15px; border-radius: 8px; border: 1px solid #ffb703; }
    .demo-box { border-color: #00b4d8; }
    .btn-deposit { background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    
    /* Main Sections */
    .card { background: #1f1f1f; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    h2 { font-size: 18px; margin-bottom: 10px; color: #ffb703; }
    .game-btn { background: #e63946; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 5px; }
    .demo-btn { background: #00b4d8; }

    /* Lottery Section */
    .winner-board { background: #2a2a2a; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    .winner-img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #ffb703; }

    /* Chat Section */
    .chat-box { background: #2a2a2a; height: 120px; border-radius: 5px; padding: 10px; overflow-y: auto; text-align: left; font-size: 13px; }
    .chat-input { width: 70%; padding: 8px; border-radius: 4px; border: none; }
    .send-btn { width: 25%; padding: 8px; background: #ffb703; border: none; border-radius: 4px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Header Section -->
  <div class="header">
    <h1>Ludo Lottery BD</h1>
    <div class="wallet-container">
      <div class="wallet-box demo-box">
        <small>Demo Coins</small>
        <h3 id="demo-balance">🪙 1,000</h3>
      </div>
      <div class="wallet-box">
        <small>Real Balance</small>
        <h3 id="real-balance">৳ 0.00</h3>
      </div>
    </div>
    <button class="btn-deposit" onclick="alert('Deposit Page Opening...')">+ Deposit / Withdraw</button>
  </div>

  <!-- Ludo Games Section -->
  <div class="card">
    <h2>🎮 লুডু গেম সেকশন</h2>
    <button class="game-btn demo-btn">Play Demo Ludo (Free)</button>
    <button class="game-btn">Play Real Ludo (৳50)</button>
  </div>

  <!-- Weekly Lottery Section -->
  <div class="card">
    <h2>🏆 সাপ্তাহিক লটারি ড্র</h2>
    <div class="winner-board">
      <img src="https://via.placeholder.com/60" class="winner-img" alt="Winner">
      <p><strong>গত সপ্তাহের বিজয়ী:</strong> রনি (ঢাকা)</p>
      <small>পুরস্কার: ৳৫০,০০০ টাকা</small>
    </div>
    <p>বর্তমান প্রাইজ পুল: <strong>৳২৫,০০০</strong></p>
    <button class="game-btn" style="background: #ffb703; color: #000;">Buy Ticket (৳৫০)</button>
  </div>

  <!-- Public Chat Section -->
  <div class="card">
    <h2>💬 পাবলিক আড্ডা রুম</h2>
    <div class="chat-box" id="chat-messages">
      <p><strong>Admin:</strong> সবাইকে Ludo Lottery BD-তে স্বাগতম!</p>
    </div>
    <div style="margin-top: 10px;">
      <input type="text" class="chat-input" placeholder="মেসেজ লিখুন...">
      <button class="send-btn">Send</button>
    </div>
  </div>

  <!-- Firebase Script Initialization -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAz3s7sdeeaKlrmUmzRGO4DpdN4siiOp9k",
      authDomain: "ludo-lottery-bd.firebaseapp.com",
      projectId: "ludo-lottery-bd",
      storageBucket: "ludo-lottery-bd.firebasestorage.app",
      messagingSenderId: "616910126041",
      appId: "1:616910126041:web:ef3fabaf22ba74020df7c8",
      databaseURL: "https://ludo-lottery-bd-default-rtdb.firebaseio.com" // আপনার প্রজেক্টের রিয়েলটাইম ডাটাবেজ URL
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    console.log("Firebase Connected Successfully!");
  </script>
</body>
</html>
