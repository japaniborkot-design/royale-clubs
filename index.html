<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Lottery BD</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0f0f15; color: #fff; text-align: center; padding: 10px; }
    
    .header { background: #1a1a24; padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #2d2d3f; }
    .user-info { font-size: 13px; color: #ffb703; margin-bottom: 5px; word-break: break-all; }
    .wallet-container { display: flex; justify-content: space-around; margin-top: 8px; }
    .wallet-box { background: #252538; padding: 8px; border-radius: 8px; border: 1px solid #ffb703; width: 45%; }
    
    .action-btn-group { display: flex; justify-content: space-between; margin-top: 10px; gap: 8px; }
    .btn-deposit { background: #28a745; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 50%; }
    .btn-withdraw { background: #e63946; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 50%; }

    .card { background: #1a1a24; padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #2d2d3f; }
    h2 { font-size: 16px; margin-bottom: 8px; color: #ffb703; }
    .game-btn { background: #e63946; color: white; border: none; padding: 10px; font-size: 14px; border-radius: 6px; cursor: pointer; margin: 4px 0; width: 100%; font-weight: bold; }

    /* Auth Overlay Screen */
    .auth-overlay { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f0f15; justify-content: center; align-items: center; z-index: 999; }
    .modal-content { background: #1a1a24; padding: 20px; border-radius: 12px; width: 90%; max-width: 360px; text-align: center; border: 1px solid #ffb703; }
    .modal-content input { width: 100%; padding: 10px; margin: 6px 0; border-radius: 5px; border: 1px solid #444; background: #111; color: white; font-size: 14px; outline: none; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; }
    .close-btn { background: #ff4757; color: white; border: none; padding: 4px 10px; border-radius: 5px; cursor: pointer; float: right; font-weight: bold; }

    #ludoCanvas { background: #fff; border: 3px solid #ffb703; border-radius: 8px; margin: 10px auto; display: block; max-width: 100%; }
    .dice-area { display: flex; justify-content: space-around; align-items: center; margin-top: 5px; }
    .dice-btn { font-size: 30px; background: #ffb703; color: #000; width: 55px; height: 55px; line-height: 55px; border-radius: 10px; cursor: pointer; font-weight: bold; }

    .chat-box { background: #11111a; height: 110px; border-radius: 5px; padding: 8px; overflow-y: auto; text-align: left; font-size: 12px; margin-bottom: 6px; border: 1px solid #333; }
    .chat-input { width: 70%; padding: 6px; border-radius: 4px; border: 1px solid #444; background: #111; color: white; }
    .send-btn { width: 26%; padding: 6px; background: #ffb703; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: #000; }
    .logout-btn { background: #555; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-left: 5px; }
  </style>
</head>
<body>

  <!-- Auth Screen (Register & Login with Gmail) -->
  <div class="auth-overlay" id="auth-screen">
    <div class="modal-content">
      <h2 id="auth-title">লগইন করুন</h2>
      <input type="email" id="auth-email" placeholder="আপনার জিমেইল (Gmail)">
      <input type="password" id="auth-pass" placeholder="পাসওয়ার্ড">
      <input type="password" id="auth-confirm-pass" placeholder="কনফার্ম পাসওয়ার্ড" style="display:none;">
      
      <button class="game-btn" id="auth-submit-btn" style="background:#28a745;" onclick="handleAuth()">লগইন</button>
      
      <p style="font-size: 12px; margin-top: 12px; color: #aaa;">
        <span id="auth-toggle-msg">একাউন্ট নেই?</span> 
        <a href="javascript:void(0)" id="auth-toggle-link" style="color:#ffb703; font-weight:bold;" onclick="toggleAuthMode()">রেজিস্ট্রেশন করুন</a>
      </p>
    </div>
  </div>

  <!-- Main App Screen -->
  <div id="main-app" style="display:none;">
    <div class="header">
      <div class="user-info">
        👤 ইউজার: <strong id="user-display-email">---</strong>
        <button class="logout-btn" onclick="logout()">লগআউট</button>
      </div>
      <div class="wallet-container">
        <div class="wallet-box" style="border-color:#00b4d8;">
          <small>Demo Coins</small>
          <h3 id="demo-balance">🪙 1,000</h3>
        </div>
        <div class="wallet-box">
          <small>Real Balance</small>
          <h3 id="real-balance">৳ <span id="real-val">0.00</span></h3>
        </div>
      </div>
      <div class="action-btn-group">
        <button class="btn-deposit" onclick="openModal('deposit-modal')">+ Deposit</button>
        <button class="btn-withdraw" onclick="openModal('withdraw-modal')">- Withdraw</button>
      </div>
    </div>

    <!-- Games Section -->
    <div class="card">
      <h2>🎮 আসল মাল্টিপ্লেয়ার লুডু</h2>
      <button class="game-btn" style="background:#00b4d8;" onclick="startLudo('Demo Mode')">Play Demo Ludo Board</button>
      <button class="game-btn" onclick="startLudo('Real Mode')">Play Real Ludo (৳50)</button>
    </div>

    <!-- Lottery Section -->
    <div class="card">
      <h2>🏆 সাপ্তাহিক লটারি ড্র</h2>
      <p>প্রাইজ পুল: <strong style="color:#ffb703;">৳২৫,০০০</strong></p>
      <button class="game-btn" style="background: #ffb703; color: #000;" onclick="buyLotteryTicket()">Buy Ticket (৳৫০)</button>
    </div>

    <!-- Public Chat Section -->
    <div class="card">
      <h2>💬 পাবলিক আড্ডা রুম</h2>
      <div class="chat-box" id="chat-messages"></div>
      <div style="display:flex; justify-content:space-between;">
        <input type="text" id="chat-input" class="chat-input" placeholder="মেসেজ লিখুন...">
        <button class="send-btn" onclick="sendChatMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- Deposit Modal -->
  <div class="modal" id="deposit-modal">
    <div class="modal-content" style="text-align:left;">
      <button class="close-btn" onclick="closeModal('deposit-modal')">X</button>
      <h3 style="color:#ffb703;">ডিপোজিট করুন</h3>
      <p style="font-size:12px; color:#fff; background:#333; padding:5px; margin:5px 0;">নগদ/বিকাশ নম্বর: <strong>01787322043</strong></p>
      <input type="number" id="dep-amount" placeholder="টাকার পরিমাণ">
      <input type="text" id="dep-trx" placeholder="Transaction ID (TrxID)">
      <button class="game-btn" style="background:#28a745;" onclick="submitDeposit()">পাঠিয়ে দিন</button>
    </div>
  </div>

  <!-- Withdraw Modal -->
  <div class="modal" id="withdraw-modal">
    <div class="modal-content" style="text-align:left;">
      <button class="close-btn" onclick="closeModal('withdraw-modal')">X</button>
      <h3 style="color:#ffb703;">উইথড্র করুন</h3>
      <input type="number" id="with-amount" placeholder="পরিমাণ (টাকা)">
      <input type="text" id="with-phone" placeholder="বিকাশ/নগদ নম্বর">
      <button class="game-btn" onclick="submitWithdraw()">রিকোয়েস্ট দিন</button>
    </div>
  </div>

  <!-- Ludo Game Modal -->
  <div class="modal" id="ludo-modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal('ludo-modal')">X</button>
      <h3 id="ludo-title" style="color:#ffb703;">Ludo Board</h3>
      <canvas id="ludoCanvas" width="300" height="300"></canvas>
      <div class="dice-area">
        <p id="ludo-status">আপনার চাল...</p>
        <div class="dice-btn" id="dice-val" onclick="rollDice()">🎲</div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAz3s7sdeeaKlrmUmzRGO4DpdN4siiOp9k",
      authDomain: "ludo-lottery-bd.firebaseapp.com",
      projectId: "ludo-lottery-bd",
      storageBucket: "ludo-lottery-bd.firebasestorage.app",
      messagingSenderId: "616910126041",
      appId: "1:616910126041:web:ef3fabaf22ba74020df7c8",
      databaseURL: "https://ludo-lottery-bd-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUserKey = localStorage.getItem("ludo_user_key");
    let currentUserEmail = localStorage.getItem("ludo_user_email");
    let isRegisterMode = false;
    let realBalance = 0;
    let demoCoins = 1000;

    if (currentUserKey && currentUserEmail) {
      showMainApp(currentUserKey, currentUserEmail);
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-title').innerText = isRegisterMode ? "নতুন একাউন্ট খুলুন" : "লগইন করুন";
      document.getElementById('auth-submit-btn').innerText = isRegisterMode ? "রেজিস্ট্রেশন করুন" : "লগইন করুন";
      document.getElementById('auth-toggle-msg').innerText = isRegisterMode ? "একাউন্ট আছে?" : "একাউন্ট নেই?";
      document.getElementById('auth-toggle-link').innerText = isRegisterMode ? "লগইন করুন" : "রেজিস্ট্রেশন করুন";
      document.getElementById('auth-confirm-pass').style.display = isRegisterMode ? "block" : "none";
    }

    function sanitizeKey(email) {
      return email.replace(/[^a-zA-Z0-9]/g, "_");
    }

    function handleAuth() {
      const email = document.getElementById('auth-email').value.trim().toLowerCase();
      const pass = document.getElementById('auth-pass').value.trim();
      const confirmPass = document.getElementById('auth-confirm-pass').value.trim();

      if (!email || !pass) return alert("জিমেইল এবং পাসওয়ার্ড সঠিকভাবে দিন!");
      if (!email.includes("@") || !email.includes(".")) return alert("সঠিক জিমেইল এড্রেস দিন!");

      const userKey = sanitizeKey(email);
      const userRef = db.ref('users_accounts/' + userKey);

      if (isRegisterMode) {
        if (pass !== confirmPass) return alert("দুইটি পাসওয়ার্ড মিলছে না!");
        if (pass.length < 4) return alert("পাসওয়ার্ড অন্তত ৪ অক্ষরের হতে হবে!");

        userRef.once('value', (snapshot) => {
          if (snapshot.exists()) {
            alert("এই জিমেইলে ইতিপূর্বে একাউন্ট খোলা হয়েছে! লগইন করুন।");
          } else {
            userRef.set({ email: email, password: pass, real_balance: 0, demo_coins: 1000, created_at: Date.now() })
              .then(() => {
                alert("একাউন্ট সফলভাবে খোলা হয়েছে!");
                loginSuccess(userKey, email);
              });
          }
        });
      } else {
        userRef.once('value', (snapshot) => {
          if (snapshot.exists() && snapshot.val().password === pass) {
            loginSuccess(userKey, email);
          } else {
            alert("জিমেইল অথবা পাসওয়ার্ড ভুল হয়েছে!");
          }
        });
      }
    }

    function loginSuccess(key, email) {
      localStorage.setItem("ludo_user_key", key);
      localStorage.setItem("ludo_user_email", email);
      currentUserKey = key;
      currentUserEmail = email;
      showMainApp(key, email);
    }

    function logout() {
      localStorage.clear();
      location.reload();
    }

    function showMainApp(key, email) {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      document.getElementById('user-display-email').innerText = email;

      db.ref('users_accounts/' + key).on('value', (snapshot) => {
        const data = snapshot.val() || {};
        demoCoins = data.demo_coins !== undefined ? data.demo_coins : 1000;
        realBalance = data.real_balance || 0;
        document.getElementById('demo-balance').innerText = '🪙 ' + demoCoins;
        document.getElementById('real-val').innerText = realBalance.toFixed(2);
      });
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function submitDeposit() {
      const amount = parseFloat(document.getElementById('dep-amount').value);
      const trx = document.getElementById('dep-trx').value;
      if (!amount || !trx) return alert("সব তথ্য সঠিকভাবে দিন!");

      db.ref('deposit_requests').push({ userId: currentUserKey, email: currentUserEmail, amount, trx, status: 'pending', time: Date.now() })
        .then(() => { alert("ডিপোজিট রিকোয়েস্ট সফলভাবে পাঠানো হয়েছে!"); closeModal('deposit-modal'); });
    }

    function submitWithdraw() {
      const amount = parseFloat(document.getElementById('with-amount').value);
      const phone = document.getElementById('with-phone').value;
      if (!amount || !phone) return alert("সব তথ্য দিন!");
      if (amount > realBalance) return alert("আপনার একাউন্টে পর্যাপ্ত ব্যালেন্স নেই!");

      db.ref('users_accounts/' + currentUserKey).update({ real_balance: realBalance - amount });
      db.ref('withdraw_requests').push({ userId: currentUserKey, email: currentUserEmail, amount, phone, status: 'pending', time: Date.now() })
        .then(() => { alert("উইথড্র রিকোয়েস্ট সফলভাবে পাঠানো হয়েছে!"); closeModal('withdraw-modal'); });
    }

    function buyLotteryTicket() {
      if (realBalance < 50) return alert("লটারি টিকিট কেনার জন্য অন্তত ৳৫০ ব্যালেন্স লাগবে!");
      db.ref('users_accounts/' + currentUserKey).update({ real_balance: realBalance - 50 });
      db.ref('lottery_tickets').push({ email: currentUserEmail, time: Date.now() });
      alert("অভিনন্দন! আপনি সফলভাবে ১টি লটারি টিকিট কিনেছেন।");
    }

    function sendChatMessage() {
      const input = document.getElementById('chat-input');
      if (input.value.trim() !== "") {
        db.ref('chats').push({ sender: currentUserEmail.split('@')[0], text: input.value.trim() });
        input.value = '';
      }
    }

    db.ref('chats').limitToLast(10).on('child_added', (snap) => {
      const msg = snap.val();
      const div = document.createElement('div');
      div.innerHTML = `<b style="color:#ffb703;">${msg.sender}:</b> ${msg.text}`;
      document.getElementById('chat-messages').appendChild(div);
    });

    function drawLudoBoard() {
      const canvas = document.getElementById('ludoCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 300, 300);
      ctx.fillStyle = "#e63946"; ctx.fillRect(0, 0, 120, 120);
      ctx.fillStyle = "#2a9d8f"; ctx.fillRect(180, 0, 120, 120);
      ctx.fillStyle = "#ffb703"; ctx.fillRect(0, 180, 120, 120);
      ctx.fillStyle = "#00b4d8"; ctx.fillRect(180, 180, 120, 120);
      ctx.fillStyle = "#fff";
      ctx.fillRect(20, 20, 80, 80); ctx.fillRect(200, 20, 80, 80);
      ctx.fillRect(20, 200, 80, 80); ctx.fillRect(200, 200, 80, 80);
      ctx.fillStyle = "#111"; ctx.fillRect(120, 120, 60, 60);
      ctx.fillStyle = "#e63946"; ctx.beginPath(); ctx.arc(40, 40, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#2a9d8f"; ctx.beginPath(); ctx.arc(220, 40, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffb703"; ctx.beginPath(); ctx.arc(40, 220, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#00b4d8"; ctx.beginPath(); ctx.arc(220, 220, 12, 0, Math.PI * 2); ctx.fill();
    }

    function startLudo(mode) {
      if (mode === 'Real Mode' && realBalance < 50) return alert("রিয়েল লুডো খেলতে ৳৫০ ব্যালেন্স লাগবে!");
      document.getElementById('ludo-title').innerText = "Ludo Board (" + mode + ")";
      openModal('ludo-modal');
      setTimeout(drawLudoBoard, 100);
    }

    function rollDice() {
      const dice = Math.floor(Math.random() * 6) + 1;
      document.getElementById('dice-val').innerText = dice;
      document.getElementById('ludo-status').innerText = "ঘুঁটি " + dice + " ঘর সামনে এগিয়েছে!";
    }
  </script>
</body>
</html>
