<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Board App</title>
  <!-- FontAwesome Icons for UI -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* মূল অ্যাপ কন্টেইনার */
    .app-container {
      width: 100%;
      max-width: 420px;
      background: #141414;
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    /* টপ বার (হেডার) */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
    }

    .menu-btn {
      font-size: 24px;
      cursor: pointer;
      color: #f39c12;
    }

    .user-info {
      font-size: 13px;
      color: #f39c12;
      font-weight: 600;
    }

    /* ব্যালেন্স কার্ড সেকশন */
    .balance-container {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 15px 20px;
    }

    .card {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .card-title {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 5px;
    }

    .card-value {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
    }

    /* লুডু বোর্ড পপআপ / কনটেইনার */
    .game-section {
      padding: 10px 20px;
      flex: 1;
    }

    .ludo-popup {
      background: #1c1c24;
      border: 2px solid #f39c12;
      border-radius: 15px;
      padding: 15px;
      position: relative;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .popup-title {
      color: #f39c12;
      font-size: 18px;
      font-weight: bold;
    }

    .close-btn {
      background: #e74c3c;
      color: white;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* লুডু বোর্ড ডিজাইন */
    .ludo-board {
      width: 100%;
      aspect-ratio: 1;
      background: #fff;
      border-radius: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      position: relative;
      border: 4px solid #fff;
    }

    .home-box {
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .red-home { background: #e74c3c; }
    .green-home { background: #2ecc71; }
    .yellow-home { background: #f1c40f; }
    .blue-home { background: #3498db; }

    .token-space {
      width: 60%;
      height: 60%;
      background: #fff;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .token {
      width: 20px;
      height: 20px;
      border-radius: 50%;
    }

    .red-token { background: #e74c3c; }
    .green-token { background: #2ecc71; }
    .yellow-token { background: #f1c40f; }
    .blue-token { background: #3498db; }

    .center-square {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20%;
      height: 20%;
      background: #000;
      border: 2px solid #fff;
    }

    /* চাল ও ডাইস সেকশন */
    .controls-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
    }

    .turn-text {
      font-size: 16px;
      color: #ddd;
    }

    .dice-btn {
      background: #f39c12;
      border: none;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .dice-btn img, .dice-icon {
      font-size: 32px;
      color: #fff;
    }

    /* থ্রি-লাইন সাইডবার মেনু (Overlay Sidebar) */
    .sidebar-overlay {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      transition: left 0.3s ease;
    }

    .sidebar-overlay.active {
      left: 0;
    }

    .sidebar {
      width: 75%;
      height: 100%;
      background: #121212;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 25px 20px;
      box-shadow: 5px 0 15px rgba(0,0,0,0.5);
    }

    /* এজেন্সি হেডার */
    .menu-agency-header {
      color: #f39c12;
      font-size: 20px;
      font-weight: bold;
      padding-bottom: 15px;
      border-bottom: 1px solid #2a2a2a;
      margin-bottom: 15px;
    }

    .menu-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #e0e0e0;
      text-decoration: none;
      font-size: 15px;
      padding: 12px 10px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .menu-item:hover {
      background: #1f1f1f;
    }

    .menu-item i {
      color: #f39c12;
      width: 20px;
    }

    /* একদম নিচের হেল্প সেন্টার (টেলিগ্রাম) */
    .menu-footer {
      margin-top: auto;
    }

    .help-center-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #0088cc;
      color: #ffffff;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      box-shadow: 0 4px 10px rgba(0,136,204,0.3);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- সাইডবার মেনু -->
    <div class="sidebar-overlay" id="sidebarOverlay">
      <div class="sidebar">
        <div>
          <!-- ১. Agency Title (উপরে) -->
          <div class="menu-agency-header">
            <i class="fas fa-building"></i> Agency Dashboard
          </div>

          <!-- ২. মেনু অপশনসমূহ -->
          <div class="menu-options">
            <a href="#" class="menu-item">
              <i class="fas fa-sign-out-alt"></i> লগআউট
            </a>
            <a href="#" class="menu-item">
              <i class="fas fa-user-shield"></i> এডমিন লগইন
            </a>
            <a href="#" class="menu-item">
              <i class="fas fa-gamepad"></i> গেম মোড
            </a>
            <a href="#" class="menu-item">
              <i class="fas fa-wallet"></i> ব্যালেন্স ডিপোজিট
            </a>
          </div>
        </div>

        <!-- ৩. হেল্প সেন্টার (একদম নিচে টেলিগ্রাম লিংক সহ) -->
        <div class="menu-footer">
          <a href="https://t.me/your_telegram_channel" target="_blank" class="help-center-btn">
            <i class="fab fa-telegram-plane"></i> হেল্প সেন্টার
          </a>
        </div>
      </div>
    </div>

    <!-- নেভিগেশন বার -->
    <div class="navbar">
      <div class="menu-btn" onclick="toggleMenu()">
        <i class="fas fa-bars"></i>
      </div>
      <div class="user-info">
        <i class="fas fa-user"></i> ইউজার: mdmuradkhan445@gmail.com
      </div>
    </div>

    <!-- ব্যালেন্স সেকশন -->
    <div class="balance-container">
      <div class="card">
        <div class="card-title">Demo Coins</div>
        <div class="card-value">🪙 1000</div>
      </div>
      <div class="card">
        <div class="card-title">Real Balance</div>
        <div class="card-value">৳ 850.00</div>
      </div>
    </div>

    <!-- লুডু বোর্ড পপআপ সেকশন -->
    <div class="game-section">
      <div class="ludo-popup">
        <div class="popup-header">
          <div class="popup-title">Ludo Board (Demo Mode)</div>
          <button class="close-btn">X</button>
        </div>

        <!-- লুডু বোর্ড -->
        <div class="ludo-board">
          <div class="home-box red-home">
            <div class="token-space"><div class="token red-token"></div></div>
          </div>
          <div class="home-box green-home">
            <div class="token-space"><div class="token green-token"></div></div>
          </div>
          <div class="home-box yellow-home">
            <div class="token-space"><div class="token yellow-token"></div></div>
          </div>
          <div class="home-box blue-home">
            <div class="token-space"><div class="token blue-token"></div></div>
          </div>
          <div class="center-square"></div>
        </div>

        <!-- কন্ট্রোল সেকশন -->
        <div class="controls-section">
          <div class="turn-text">আপনার চাল...</div>
          <button class="dice-btn">
            <i class="fas fa-dice-five dice-icon"></i>
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // সাইডবার মেনু ওপেন ও ক্লোজ করার ফাংশন
    function toggleMenu() {
      const sidebar = document.getElementById('sidebarOverlay');
      sidebar.classList.toggle('active');
    }

    // মেনুর বাইরে ক্লিক করলে মেনু বন্ধ হওয়ার লজিক
    document.getElementById('sidebarOverlay').addEventListener('click', function(e) {
      if (e.target === this) {
        toggleMenu();
      }
    });
  </script>

</body>
</html>
